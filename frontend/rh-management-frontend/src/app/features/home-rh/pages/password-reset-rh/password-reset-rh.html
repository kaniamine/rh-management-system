<div class="prh-page">

  <div class="prh-header">
    <h1>Réinitialisation des mots de passe</h1>
    <p>Réinitialisez manuellement le mot de passe d'un employé et envoyez-lui un SMS.</p>
  </div>

  <div class="reset-card">
    <div class="reset-panel">

      <div class="field">
        <label>Matricule de l'employé</label>
        <input type="text" class="input"
               [(ngModel)]="matricule"
               placeholder="ex: EMP001"
               [disabled]="submitLoading" />
      </div>

      <div class="field">
        <label>Nouveau mot de passe temporaire</label>
        <div class="password-gen-row">
          <input type="text" class="input"
                 [(ngModel)]="nouveauMotDePasse"
                 placeholder="Saisir ou générer"
                 [disabled]="submitLoading" />
          <button type="button" class="gen-btn"
                  (click)="genererMotDePasse()"
                  [disabled]="submitLoading">
            Générer
          </button>
        </div>
      </div>

      @if (submitError) {
        <p class="form-error">{{ submitError }}</p>
      }
      @if (submitSuccess) {
        <p class="form-success">{{ submitSuccess }}</p>
      }

      <button type="button" class="confirm-btn"
              (click)="reinitialiser()"
              [disabled]="submitLoading">
        {{ submitLoading ? 'Réinitialisation en cours...' : 'Réinitialiser le mot de passe' }}
      </button>

    </div>
  </div>

</div>
