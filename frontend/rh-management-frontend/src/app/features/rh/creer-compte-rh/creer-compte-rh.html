<div style="max-width:600px; margin:40px auto; padding:0 16px; font-family:'Mada','Open Sans',Arial,sans-serif;">

  <div style="background:white; border-radius:16px; padding:40px; box-shadow:0 4px 20px rgba(0,0,0,0.08);">

    <div style="display:flex; align-items:center; gap:12px; margin-bottom:32px;">
      <div style="width:48px; height:48px; background:#ff5800; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div>
        <h2 style="margin:0; color:#ff5800; font-size:20px; font-weight:800;">Créer un compte RH</h2>
        <p style="margin:0; color:#5e6167; font-size:13px;">Privilège Administrateur requis</p>
      </div>
    </div>

    @if (erreur) {
      <div style="background:#fff0f3; border:1px solid #c60c30; border-radius:8px; padding:12px 16px; color:#c60c30; margin-bottom:20px; font-size:13px;">
        ⚠️ {{ erreur }}
      </div>
    }
    @if (succes) {
      <div style="background:#f0fff4; border:1px solid #0D776E; border-radius:8px; padding:12px 16px; color:#0D776E; margin-bottom:20px; font-size:13px;">
        ✅ {{ succes }}
      </div>
    }

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Matricule *</label>
        <input [(ngModel)]="form.matricule" placeholder="RH001"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Nom *</label>
        <input [(ngModel)]="form.nom" placeholder="Ben Ali"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Prénom *</label>
        <input [(ngModel)]="form.prenom" placeholder="Mohamed"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Téléphone</label>
        <input [(ngModel)]="form.telephone" placeholder="XX XXX XXX"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div style="grid-column: span 2;">
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Email</label>
        <input [(ngModel)]="form.email" type="email" placeholder="email@albaraka.com.tn"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Service</label>
        <input [(ngModel)]="form.service" placeholder="Gestion du personnel"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div>
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Fonction</label>
        <input [(ngModel)]="form.fonction" placeholder="Chargé RH"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
      </div>

      <div style="grid-column: span 2;">
        <label style="font-size:13px; font-weight:700; color:#5e6167; display:block; margin-bottom:6px;">Mot de passe temporaire *</label>
        <input [(ngModel)]="form.motDePasse" type="password" placeholder="Mot de passe temporaire"
               style="width:100%; padding:10px 14px; border:2px solid #e5e7eb; border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; font-family:inherit;" />
        <p style="font-size:11px; color:#a7a9ac; margin:4px 0 0;">
          L'employé devra changer ce mot de passe à sa première connexion.
        </p>
      </div>

    </div>

    <div style="display:flex; gap:12px; margin-top:28px;">
      <a routerLink="/dashboard-rh"
         style="flex:1; padding:12px; background:#f8f9fa; border:2px solid #e5e7eb; border-radius:10px; font-size:14px; font-weight:700; color:#5e6167; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; font-family:inherit;">
        Annuler
      </a>
      <button (click)="creerCompte()" [disabled]="isLoading"
              style="flex:2; padding:12px; background:#ff5800; border:none; border-radius:10px; font-size:14px; font-weight:700; color:white; cursor:pointer; font-family:inherit; transition:opacity 0.15s;"
              [style.opacity]="isLoading ? '0.6' : '1'">
        {{ isLoading ? 'Création en cours…' : 'Créer le compte RH' }}
      </button>
    </div>

  </div>
</div>
