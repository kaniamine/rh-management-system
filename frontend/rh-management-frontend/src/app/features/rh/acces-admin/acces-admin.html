<div class="admin-page">

  <div class="admin-overlay"></div>

  <div class="admin-card">

    <div class="shield-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="white">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
    </div>

    <h1>Accès Administrateur</h1>
    <p class="subtitle">Espace sécurisé — Al Baraka Assurances</p>
    <p class="description">
      Saisissez votre clé d'accès administrateur pour débloquer les privilèges avancés.
    </p>

    <div class="field-group">
      <label>Clé d'accès</label>
      <div class="input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#a7a9ac" class="input-icon">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <input
          [type]="showCle ? 'text' : 'password'"
          [(ngModel)]="cleAdmin"
          placeholder="••••••••••••"
          (keydown.enter)="validerCle()"
          class="cle-input" />
        <button class="toggle-btn" type="button" (click)="toggleShowCle()">
          {{ showCle ? 'Masquer' : 'Afficher' }}
        </button>
      </div>
    </div>

    @if (erreur) {
      <div class="erreur-msg">⚠️ {{ erreur }}</div>
    }

    <div class="btn-group">
      <button class="btn-annuler" type="button" (click)="annuler()">Annuler</button>
      <button class="btn-valider" type="button"
              (click)="validerCle()"
              [disabled]="isLoading || !cleAdmin.trim()">
        {{ isLoading ? 'Vérification…' : 'Accéder' }}
      </button>
    </div>

    <p class="warning-text">
      🔒 Cet accès est réservé aux administrateurs autorisés.
      Toute tentative non autorisée est enregistrée.
    </p>

  </div>
</div>
