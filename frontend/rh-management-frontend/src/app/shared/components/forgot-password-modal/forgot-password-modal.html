<div class="modal-overlay" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div>
        <div class="form-badge">Mot de passe oublié</div>
        <p class="modal-subtitle">
          Saisissez votre matricule pour envoyer une demande de réinitialisation à la RH.
        </p>
      </div>
      <button type="button" class="close-btn" (click)="close()">✕</button>
    </div>

    <div class="field">
      <label for="fp-matricule">Matricule <span class="required">*</span></label>
      <input
        id="fp-matricule"
        type="text"
        class="input"
        placeholder="ex: EMP002"
        [(ngModel)]="matricule"
        [disabled]="loading || !!successMessage"
      />
    </div>

    @if (errorMessage) {
      <p class="msg-error">{{ errorMessage }}</p>
    }
    @if (successMessage) {
      <p class="msg-success">{{ successMessage }}</p>
    }

    @if (!successMessage) {
      <button type="button" class="submit-btn" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Envoi en cours...' : 'Envoyer la demande' }}
      </button>
    } @else {
      <button type="button" class="close-btn-full" (click)="close()">Fermer</button>
    }

  </div>
</div>
